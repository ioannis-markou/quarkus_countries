quarkus.tls.trust-all=true
quarkus.rest-client.countries.url=https://restcountries.com/v3.1

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=demo
quarkus.datasource.password=demo

# Hibernate SQL Statement logging
quarkus.hibernate-orm.log.sql=true

# Flyway settings
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# Choose data source: restcountries | oorsprong
country-service.data-source=oorsprong

# Auto-sync database on startup
country-service.sync-on-startup=true

# SOAP service base path
quarkus.cxf.path=/ws

# Expose your SOAP endpoint at:
#   http://localhost:8080/ws/country-service?wsdl
quarkus.cxf.endpoint."/country-service".implementor=org.acme.model.soap.SoapCountryService

# ---- WSDL2JAVA CODE GENERATION ----
# Enable Quarkus CXF WSDL ? Java generation
quarkus.cxf.codegen.wsdl2java.enabled=true

# Include all WSDLs from src/main/resources/wsdl/
quarkus.cxf.codegen.wsdl2java.includes=wsdl/*.wsdl

# Optional: map WSDL namespace to your Java package
quarkus.cxf.codegen.wsdl2java.package-names=http://www.oorsprong.org/websamples.countryinfo=org.acme.soapclient

soap.wsdl.url=http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso?WSDL
soap.namespace=http://www.oorsprong.org/websamples.countryinfo
soap.service.name=CountryInfoService
soap.port.name=CountryInfoServiceSoap

quarkus.swagger-ui.path=/apis